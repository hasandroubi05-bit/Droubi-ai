<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Droubi AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#101114">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #101114;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            background: #18191e;
            border-bottom: 1px solid #2a2b32;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #26272f;
            color: #e5e7eb;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 12px;
            background-color: #18191e;
            border-top: 1px solid #2a2b32;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            background-color: #26272f;
            border: 1px solid #3f404a;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        #user-input:focus {
            border-color: #2563eb;
        }
        #send-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:active {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <header>Droubi AI 🤖</header>

    <div id="chat-container">
        <div class="message ai-message">أهلاً بك يا معلم! أنا Droubi AI جاهز لمساعدتك.</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا...">
        <button id="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = prompt;
            chatContainer.appendChild(userMsgDiv);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = 'جاري التفكير...';
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // المحاولة الأولى عبر النظام الأساسي
                const response = await fetch(`https://kaas.pollinations.ai/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: prompt }],
                        model: 'openai'
                    })
                });
                
                const data = await response.json();
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    aiMsgDiv.textContent = data.choices[0].message.content;
                } else {
                    throw new Error('Invalid response');
                }
            } catch (error) {
                // النظام الاحتياطي الفوري في حال الضغط
                try {
                    const res2 = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                    const text2 = await res2.text();
                    aiMsgDiv.textContent = text2;
                } catch (e) {
                    aiMsgDiv.textContent = 'عذراً، حدث خطأ في الاتصال بالسيرفر.';
                }
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
