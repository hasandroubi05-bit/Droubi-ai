<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Droubi AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

header {
  padding: 18px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  border-bottom: 1px solid #292b31;
}

.chat {
  height: calc(100vh - 140px);
  padding: 20px;
  overflow-y: auto;
}

.welcome {
  text-align: center;
  margin-top: 80px;
}

.welcome h1 {
  font-size: 30px;
}

.welcome p {
  color: #aaa;
}

.message {
  margin: 12px 0;
  padding: 13px 16px;
  border-radius: 16px;
  max-width: 85%;
  line-height: 1.6;
}

.user {
  background: #315efb;
  margin-right: auto;
}

.ai {
  background: #24262c;
  margin-left: auto;
}

.bottom {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 12px;
  background: #101114;
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #444;
  background: #1d1f24;
  color: white;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 0 20px;
  background: #315efb;
  color: white;
  font-size: 16px;
}

button:active {
  transform: scale(.97);
}
</style>
</head>

<body>

<header>🤖 Droubi AI</header>

<div class="chat" id="chat">
  <div class="welcome">
    <h1>مرحباً بك في Droubi AI</h1>
    <p>اكتب سؤالك بالأسفل</p>
  </div>
</div>

<div class="bottom">
  <input id="input" placeholder="اكتب سؤالك هنا..." />
  <button onclick="sendMessage()">إرسال</button>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const text = input.value.trim();

  if (!text) return;

  document.querySelector(".welcome")?.remove();

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;
  chat.appendChild(userMessage);

  input.value = "";

  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai";
  aiMessage.textContent =
    "أنا Droubi AI. تم استلام رسالتك. سنربطني الآن بنموذج ذكاء اصطناعي حتى أقدر أجاوبك فعلياً.";
  chat.appendChild(aiMessage);

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
  </html>
